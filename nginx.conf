server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Chrome-less embed widgets (e.g. /embed/campaign/<naddr>) are meant to be
    # iframed on third-party sites. nginx does NOT inherit the server-level
    # `add_header` directives into a location that declares its own, so this
    # block intentionally drops the global `X-Frame-Options: SAMEORIGIN`,
    # re-adds the other security headers, and swaps in `frame-ancestors *`.
    # Only the /embed/* routes are framable; the rest of the app below keeps
    # the SAMEORIGIN lock.
    location /embed/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "frame-ancestors *" always;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
